[project]
name = "ifrs9-pd-model"
version = "0.1.0"
description = "IFRS 9 probability-of-default model: WoE scorecard, calibration, lifetime term structure, SICR staging, ECL, and an independent validation suite that writes a model-validation report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
ifrs9-pd = "ifrs9_pd.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifrs9_pd"]
